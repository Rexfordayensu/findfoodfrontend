<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the `--base-href` argument of `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="FindFood — order from local restaurants and track your delivery live.">
  <meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FindFood">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>FindFood</title>

  <!-- Start slow work early: open connections and download the app code in
       parallel with the loader instead of one after another. -->
  <link rel="preconnect" href="https://findfooddelivery-backend.onrender.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preload" href="icons/logo-mark.png" as="image">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <script>
    // Wake the API server (Render puts idle servers to sleep) while the app
    // is still downloading, so it is ready by the time the app needs it.
    try {
      fetch('https://findfooddelivery-backend.onrender.com/health/live',
            { mode: 'no-cors', cache: 'no-store' }).catch(function () {});
    } catch (e) {}
  </script>

  <style>
    @font-face {
      font-family: 'PlusJakartaSans';
      src: url('assets/assets/fonts/PlusJakartaSans-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-display: swap;
    }
    :root { --bg: #F2F4F8; --text: #0F172A; --muted: #526075; --track: #E4E7EE; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0B0C10; --text: #F4F5F7; --muted: #A3A9B6; --track: #262A33; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(420px 420px at 85% 0%, rgba(254, 215, 0, .20), transparent 70%),
        radial-gradient(420px 420px at 0% 55%, rgba(125, 211, 252, .16), transparent 70%),
        var(--bg);
      font-family: 'PlusJakartaSans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .35s ease;
      z-index: 9999;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo {
      width: 96px; height: 96px; border-radius: 11px; display: block;
      box-shadow: 0 14px 34px rgba(254, 215, 0, .35);
      animation: pop .6s cubic-bezier(.2, .9, .3, 1.3) both;
    }
    #splash .name {
      color: var(--text); font-size: 30px; font-weight: 800; letter-spacing: .5px;
      position: relative; margin-top: 4px;
    }
    #splash .name sup { font-size: 10px; font-weight: 800; position: absolute; top: 2px; right: -14px; }
    #splash .tag { color: var(--muted); font-size: 14px; margin-top: -10px; }
    #splash .bar {
      width: 140px; height: 4px; border-radius: 4px; background: var(--track);
      overflow: hidden; margin-top: 6px;
    }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #FED700;
      animation: slide 1.1s ease-in-out infinite;
    }
    #splash-problem { text-align: center; margin-top: 4px; max-width: 280px; padding: 0 16px; }
    #splash-problem .problem-title { color: var(--text); font-size: 16px; font-weight: 800; }
    #splash-problem .problem-detail { color: var(--muted); font-size: 13px; margin-top: 4px; }
    #splash-problem button {
      margin-top: 14px; border: 0; border-radius: 999px; padding: 11px 22px;
      background: #FED700; color: #111; font: inherit; font-size: 14px; font-weight: 800;
      cursor: pointer;
    }
    #splash.stuck .bar { display: none; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #splash .logo, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading FindFood">
    <img class="logo" src="icons/logo-mark.png" width="96" height="96" alt="" aria-hidden="true">
    <div class="name">FINDFOOD<sup>TM</sup></div>
    <div class="tag">Food delivery, done fast</div>
    <div class="bar"></div>
  </div>

  <script>
    // If the app's code fails to download (a mobile-network hiccup, the tab
    // put in the background), retry once on our own; if that fails too, say
    // so on the splash with a Try again button instead of loading forever.
    // Only a failure that survives the retry is reported to admins, with the
    // connection details; offline phones and pages being closed are ignored.
    (function () {
      var drawn = false, leaving = false, handled = false;
      var RETRY_KEY = 'findfood-load-retry';
      window.addEventListener('flutter-first-frame', function () {
        drawn = true;
        try { sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
      });
      window.addEventListener('pagehide', function () { leaving = true; });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') leaving = true;
      });

      function retries() {
        try { return Number(sessionStorage.getItem(RETRY_KEY) || 0); } catch (e) { return 1; }
      }

      function showProblem(title, detail) {
        var splash = document.getElementById('splash');
        if (!splash || document.getElementById('splash-problem')) return;
        var box = document.createElement('div');
        box.id = 'splash-problem';
        box.innerHTML = '<div class="problem-title"></div><div class="problem-detail"></div>' +
          '<button type="button">Try again</button>';
        box.querySelector('.problem-title').textContent = title;
        box.querySelector('.problem-detail').textContent = detail;
        box.querySelector('button').addEventListener('click', function () {
          try { sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
          location.reload();
        });
        splash.appendChild(box);
        splash.classList.add('stuck');
      }

      function report(message, extra) {
        try {
          var connection = navigator.connection || {};
          fetch('https://findfooddelivery-backend.onrender.com/client-errors', {
            method: 'POST', keepalive: true,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              error_type: 'LoadError',
              message: String(message).slice(0, 1000),
              stack: [
                extra || '',
                'online: ' + navigator.onLine,
                'connection: ' + (connection.effectiveType || 'unknown'),
                'retried: ' + retries()
              ].join('\n'),
              route: location.pathname
            })
          }).catch(function () {});
        } catch (e) {}
      }

      window.addEventListener('error', function (event) {
        if (drawn || handled) return;
        var target = event.target && event.target !== window ? event.target : null;
        // The preload hint failing doesn't matter; the script itself does.
        if (target && target.tagName === 'LINK') return;
        if (target && target.tagName !== 'SCRIPT') return;
        var what = target ? target.src : (event.message || 'Unknown error');
        if (!target) {
          // A script error before the first frame: report it as it is.
          report(what, event.filename ? event.filename + ':' + event.lineno + ':' + event.colno : '');
          return;
        }
        handled = true;
        if (leaving) return; // the page was being closed or hidden
        if (!navigator.onLine) {
          showProblem("You're offline", 'Connect to the internet, then try again.');
          return;
        }
        if (retries() < 1) {
          try { sessionStorage.setItem(RETRY_KEY, '1'); } catch (e) {}
          setTimeout(function () { location.reload(); }, 800);
          return;
        }
        report('Could not load ' + what);
        showProblem("Couldn't load FindFood", 'Check your connection, then try again.');
      }, true);

      // Very slow networks: offer a reload instead of an endless spinner.
      setTimeout(function () {
        if (!drawn && !leaving) {
          showProblem('Taking longer than usual', 'Your connection may be slow.');
        }
      }, 20000);
    })();
  </script>

  <script>
    // Fade the splash out as soon as Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script>
    // Web push and the app icon badge, used by the app (lib/services/push_bridge_web.dart).
    // sw.js shows notifications and sets the badge while the app is closed.
    window.findfoodPush = (function () {
      var listeners = [];
      var pending = [];
      function supported() {
        return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      }
      function emit(message) {
        var text = JSON.stringify(message || {});
        if (listeners.length === 0) { pending.push(text); return; }
        listeners.forEach(function (fn) { try { fn(text); } catch (e) {} });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
        navigator.serviceWorker.addEventListener('message', function (e) { emit(e.data); });
      }
      function keyBytes(base64) {
        var padded = (base64 + '===='.slice((base64.length % 4) || 4)).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(padded);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return bytes;
      }
      function sameKey(subscription, bytes) {
        var current = subscription.options && subscription.options.applicationServerKey;
        if (!current) return true;
        var a = new Uint8Array(current);
        if (a.length !== bytes.length) return false;
        for (var i = 0; i < a.length; i++) if (a[i] !== bytes[i]) return false;
        return true;
      }
      async function registration() {
        return navigator.serviceWorker.ready;
      }
      return {
        supported: function () { return supported(); },
        permission: function () { return supported() ? Notification.permission : 'unsupported'; },
        standalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        },
        ios: function () {
          return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        // Asks for permission (call from a tap) and returns the subscription as JSON.
        subscribe: async function (key) {
          if (!supported()) return null;
          var permission = Notification.permission === 'granted'
            ? 'granted' : await Notification.requestPermission();
          if (permission !== 'granted') return null;
          var reg = await registration();
          var bytes = keyBytes(key);
          var sub = await reg.pushManager.getSubscription();
          if (sub && !sameKey(sub, bytes)) { await sub.unsubscribe(); sub = null; }
          if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
          return JSON.stringify(sub.toJSON());
        },
        current: async function () {
          if (!supported()) return null;
          var reg = await registration();
          var sub = await reg.pushManager.getSubscription();
          return sub ? JSON.stringify(sub.toJSON()) : null;
        },
        unsubscribe: async function () {
          if (!supported()) return null;
          var reg = await registration();
          var sub = await reg.pushManager.getSubscription();
          if (!sub) return null;
          var endpoint = sub.endpoint;
          await sub.unsubscribe();
          return endpoint;
        },
        setBadge: function (count) {
          try {
            if (!('setAppBadge' in navigator)) return;
            if (count > 0) navigator.setAppBadge(count).catch(function () {});
            else navigator.clearAppBadge().catch(function () {});
          } catch (e) {}
        },
        listen: function (fn) {
          listeners.push(fn);
          var queued = pending; pending = [];
          queued.forEach(function (text) { try { fn(text); } catch (e) {} });
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
