name: findfood_app
description: Premium local food delivery app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2           #  Aligned with "flutter:"

  http: ^1.2.0
  web_socket_channel: 3.0.3 # NEW: for live real-time chat
  image_picker: ^1.2.3      # NEW: for restaurant menu photo uploads
  geolocator: ^13.0.2
  url_launcher: ^6.1.7
  app_links: ^7.2.1
  flutter_secure_storage: ^10.3.1
  flutter_web_plugins:
    sdk: flutter
  go_router: 16.2.4
  http_parser: 4.1.2
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Used by tests to stand in for the chat WebSocket.
  async: any
  stream_channel: any

flutter:
  uses-material-design: true
  assets:
    - assets/brand/google_g.png
    - assets/brand/networks/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
